<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blocky player — a Blocky character in a browser game</title>
  <link rel="icon" href="data:," />
  <style>
    :root { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; color: #e6e8ec; }
    html, body { margin: 0; height: 100%; background: #1b1d22; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 8px;
      background: rgba(35, 38, 45, 0.92); border: 1px solid #363b47; border-radius: 6px; padding: 10px 12px; max-width: 320px;
    }
    #hud h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: 2px; color: #f2b43c; }
    #hud .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #hud label { color: #8b919e; }
    button, select, input { font: inherit; color: inherit; }
    button { background: #2b2f38; border: 1px solid #363b47; border-radius: 4px; padding: 4px 9px; cursor: pointer; }
    button:hover { border-color: #f2b43c; }
    select { background: #1b1d22; border: 1px solid #363b47; border-radius: 4px; padding: 3px 6px; }
    #stats { color: #8b919e; font-size: 11px; line-height: 1.5; }
    #hint { color: #8b919e; font-size: 11px; line-height: 1.5; }
    #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(242,180,60,0.15); font-size: 20px; pointer-events: none; }
    body.dragging #drop { display: flex; }
    #msg { color: #e2574e; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="drop">Drop a .glb to load it</div>
  <div id="hud">
    <h1>BLOCKY PLAYER</h1>
    <div class="row">
      <button id="btn-open">Open .glb</button>
      <input id="file" type="file" accept=".glb,model/gltf-binary" hidden />
      <span id="model-name" style="color:#8b919e"></span>
    </div>
    <div class="row">
      <label>Clip</label>
      <select id="clip"></select>
      <button id="play">❚❚</button>
      <label>Speed</label>
      <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1" style="width:80px" />
    </div>
    <div class="row">
      <button id="clones">Spawn 24 clones</button>
      <button id="clear">Clear clones</button>
      <label><input id="skeleton" type="checkbox" /> Show skeleton</label>
    </div>
    <div id="stats"></div>
    <div id="hint">
      <b>WASD</b> walk · <b>Space</b> attack · drag to orbit, wheel to zoom.<br />
      Clips named <i>walk</i>, <i>idle</i> and <i>attack</i> are used by the controller.
    </div>
    <div id="msg"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

    const $ = id => document.getElementById(id);

    // ----- scene -----
    const canvas = $('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x2a2e36);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
    camera.position.set(3, 2.2, 4);
    scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x3a3025, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(4, 7, 3); scene.add(key);
    const fill = new THREE.DirectionalLight(0xbcd0ff, 0.35); fill.position.set(-5, 2, -4); scene.add(fill);
    scene.add(new THREE.GridHelper(20, 40, 0x5a6170, 0x3b414d));
    const orbit = new OrbitControls(camera, canvas);
    orbit.target.set(0, 0.9, 0);
    orbit.enableDamping = true;
    function resize() {
      const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ----- characters -----
    const loader = new GLTFLoader();
    let template = null;   // { scene, animations } as loaded
    let hero = null;       // the controllable character
    const clones = [];
    let skeletonHelpers = [];

    /** Makes an independent, animatable copy of the loaded model (shares geometry and clips). */
    function makeCharacter(position = [0, 0, 0]) {
      const object = SkeletonUtils.clone(template.scene);
      object.position.fromArray(position);
      const mixer = new THREE.AnimationMixer(object);
      const actions = {};
      for (const clip of template.animations) actions[clip.name] = mixer.clipAction(clip);
      const ch = { object, mixer, actions, current: null };
      scene.add(object);
      return ch;
    }

    function findClip(ch, ...names) {
      const keys = Object.keys(ch.actions);
      for (const n of names) {
        const k = keys.find(k => k.toLowerCase().includes(n));
        if (k) return k;
      }
      return null;
    }

    /** Cross-fades to a clip. `once` plays it a single time and then returns to the previous clip. */
    function play(ch, name, { fade = 0.2, once = false, speed = 1 } = {}) {
      const action = ch.actions[name];
      if (!action) return null;
      if (ch.current === action && !once) return action;
      const prev = ch.current;
      action.reset();
      action.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
      action.clampWhenFinished = once;
      action.timeScale = speed;
      action.enabled = true;
      if (prev && prev !== action) { action.crossFadeFrom(prev, fade, true); }
      action.play();
      ch.current = action;
      if (once) {
        const back = e => {
          if (e.action !== action) return;
          ch.mixer.removeEventListener('finished', back);
          ch.busy = false;
          const idle = findClip(ch, 'idle');
          if (idle) play(ch, idle);
        };
        ch.busy = true;
        ch.mixer.addEventListener('finished', back);
      }
      return action;
    }

    function dispose(ch) {
      ch.mixer.stopAllAction();
      scene.remove(ch.object);
    }

    function setModel(gltf, name = 'model') {
      if (hero) dispose(hero);
      clearClones();
      template = { scene: gltf.scene, animations: gltf.animations || [] };
      hero = makeCharacter();
      const sel = $('clip');
      sel.innerHTML = '';
      for (const clip of template.animations) sel.appendChild(new Option(`${clip.name} (${clip.duration.toFixed(2)}s)`, clip.name));
      const first = findClip(hero, 'idle') || template.animations[0]?.name;
      if (first) { play(hero, first); sel.value = first; }
      $('model-name').textContent = name;
      $('msg').textContent = template.animations.length ? '' : 'This file has no animation clips.';
      setSkeleton($('skeleton').checked);
      // frame the model
      const box = new THREE.Box3().setFromObject(hero.object);
      const size = box.getSize(new THREE.Vector3()).length() || 2;
      const center = box.getCenter(new THREE.Vector3());
      orbit.target.copy(center);
      camera.position.set(center.x + size * 0.9, center.y + size * 0.6, center.z + size * 1.3);
    }

    function loadBuffer(buffer, name) {
      loader.parse(buffer, '', gltf => setModel(gltf, name), err => { $('msg').textContent = `Could not load: ${err.message || err}`; });
    }
    function loadURL(url) {
      loader.load(url, gltf => setModel(gltf, url.split('/').pop()), undefined, err => { $('msg').textContent = `Could not load ${url}`; });
    }

    // ----- clones: same skeleton and clips, different poses -----
    function spawnClones(n = 24) {
      if (!template) return;
      const names = Object.keys(hero.actions);
      const cols = Math.ceil(Math.sqrt(n));
      for (let i = 0; i < n; i++) {
        const x = (i % cols) - (cols - 1) / 2, z = Math.floor(i / cols) + 1.5;
        const ch = makeCharacter([x * 1.3, 0, z * 1.3]);
        ch.object.rotation.y = Math.random() * Math.PI * 2;
        if (names.length) {
          const a = play(ch, names[Math.floor(Math.random() * names.length)], { fade: 0 });
          if (a) a.time = Math.random() * a.getClip().duration;
        }
        clones.push(ch);
      }
      setSkeleton($('skeleton').checked);
    }
    function clearClones() {
      for (const c of clones) dispose(c);
      clones.length = 0;
      setSkeleton($('skeleton').checked);
    }

    function setSkeleton(on) {
      for (const h of skeletonHelpers) scene.remove(h);
      skeletonHelpers = [];
      if (!on) return;
      for (const ch of [hero, ...clones].filter(Boolean)) {
        const h = new THREE.SkeletonHelper(ch.object);
        h.material.linewidth = 2;
        scene.add(h);
        skeletonHelpers.push(h);
      }
    }

    // ----- a tiny controller: WASD walks, Space attacks -----
    const keys = new Set();
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      keys.add(e.key.toLowerCase());
      if (e.key === ' ' && hero && !hero.busy) {
        e.preventDefault();
        const attack = findClip(hero, 'attack', 'hit', 'swing');
        if (attack) play(hero, attack, { once: true, fade: 0.1 });
      }
    });
    window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

    const dir = new THREE.Vector3(), camFwd = new THREE.Vector3(), camRight = new THREE.Vector3();
    function control(dt) {
      if (!hero || hero.busy) return;
      camera.getWorldDirection(camFwd); camFwd.y = 0; camFwd.normalize();
      camRight.crossVectors(camFwd, new THREE.Vector3(0, 1, 0));
      dir.set(0, 0, 0);
      if (keys.has('w') || keys.has('arrowup')) dir.add(camFwd);
      if (keys.has('s') || keys.has('arrowdown')) dir.sub(camFwd);
      if (keys.has('d') || keys.has('arrowright')) dir.add(camRight);
      if (keys.has('a') || keys.has('arrowleft')) dir.sub(camRight);
      const moving = dir.lengthSq() > 0;
      if (moving) {
        dir.normalize();
        hero.object.position.addScaledVector(dir, 1.6 * dt);
        hero.object.rotation.y = Math.atan2(dir.x, dir.z);
        const walk = findClip(hero, 'walk', 'run');
        if (walk && !userPicked) play(hero, walk);
        orbit.target.lerp(hero.object.position.clone().setY(0.9), 0.15);
        camera.position.addScaledVector(dir, 1.6 * dt);
      } else if (!userPicked) {
        const idle = findClip(hero, 'idle', 'stand');
        if (idle) play(hero, idle);
      }
    }
    let userPicked = false; // the clip menu overrides the controller until you move

    // ----- HUD -----
    $('btn-open').addEventListener('click', () => $('file').click());
    $('file').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      loadBuffer(await f.arrayBuffer(), f.name);
      e.target.value = '';
    });
    $('clip').addEventListener('change', e => { if (hero) { userPicked = true; play(hero, e.target.value); } });
    $('play').addEventListener('click', () => { if (!hero) return; hero.mixer.timeScale = hero.mixer.timeScale ? 0 : 1; $('play').textContent = hero.mixer.timeScale ? '❚❚' : '▶'; });
    $('speed').addEventListener('input', e => { for (const ch of [hero, ...clones].filter(Boolean)) ch.mixer.timeScale = Number(e.target.value); });
    $('clones').addEventListener('click', () => spawnClones(24));
    $('clear').addEventListener('click', clearClones);
    $('skeleton').addEventListener('change', e => setSkeleton(e.target.checked));
    window.addEventListener('keydown', e => { if (['w', 'a', 's', 'd'].includes(e.key.toLowerCase())) userPicked = false; });

    // Drag and drop
    window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
    window.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
    window.addEventListener('drop', async e => {
      e.preventDefault(); document.body.classList.remove('dragging');
      const f = e.dataTransfer.files[0]; if (f) loadBuffer(await f.arrayBuffer(), f.name);
    });

    // Opened from the editor ("Preview in player"): the editor posts the GLB bytes.
    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'blocky-glb' && e.data.data instanceof ArrayBuffer) loadBuffer(e.data.data, `${e.data.name || 'model'}.glb`);
    });
    if (window.opener) window.opener.postMessage({ type: 'blocky-player-ready' }, '*');

    const params = new URLSearchParams(location.search);
    if (params.get('model')) loadURL(params.get('model'));
    else if (!params.has('embedded')) loadURL('guard.glb');

    // ----- loop -----
    const clock = new THREE.Clock();
    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.1);
      control(dt);
      if (hero) hero.mixer.update(dt);
      for (const c of clones) c.mixer.update(dt);
      orbit.update();
      renderer.render(scene, camera);
      const info = renderer.info.render;
      $('stats').textContent = `${1 + clones.length} character(s) · ${info.calls} draw calls · ${info.triangles} triangles`;
    }
    frame();

    window.player = {
      get hero() { return hero; }, get clones() { return clones; }, get template() { return template; },
      play: name => hero && play(hero, name), loadURL, loadBuffer, spawnClones, clearClones, scene, renderer,
    };
  </script>
</body>
</html>
